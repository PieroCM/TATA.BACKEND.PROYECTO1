services:
  # ============================================================================
  # 1. Base de Datos: Microsoft SQL Server 2022
  # ============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sla_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sla_network
    restart: unless-stopped

  # ============================================================================
  # 2. Backend: .NET 9 Web API
  # ============================================================================
  backend:
    image: josed20/proyectofinal-backend:1.0.0
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sla_backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DevConnection: "Server=sqlserver,1433;Database=Proyecto1SLA_DB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Command Timeout=180"
      JWTSettings__SecretKey: "${JWT_SECRET}"
      SmtpSettings__Password: "${SMTP_PASSWORD}"
      SmtpSettings__User: "${SMTP_USER}"
      SmtpSettings__From: "${SMTP_FROM}"
      AppSettings__FrontendBaseUrl: "http://localhost:9000/#"
    ports:
      - "5260:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sla_network
    restart: unless-stopped

  # ============================================================================
  # 3. Frontend & Reverse Proxy: Quasar SPA + Nginx
  # ============================================================================
  frontend:
    image: josed20/proyectofinal-frontend:1.0.0
    build:
      context: ../../TATA.FRONTEND.PROYECTO1
      dockerfile: Dockerfile
    container_name: sla_frontend
    ports:
      - "9000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sla_network
    restart: unless-stopped

# ==============================================================================
# Redes y Volúmenes con Nombre (Persistencia y Aislamiento)
# ==============================================================================
networks:
  sla_network:
    name: sla_network
    driver: bridge

volumes:
  sqlserver_data:
    name: sla_sqlserver_data
    driver: local
